[workspace]
members = ["crates/herdrmd-core", "crates/herdrmd", "tools/herdrmd-diagnostics"]
default-members = ["crates/herdrmd-core", "crates/herdrmd"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
repository = "https://github.com/HMGwak/herdrmd"
publish = false

[workspace.dependencies]
herdrmd-core = { path = "crates/herdrmd-core" }
