name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $toolchain = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "([^"]+)"$').Matches.Groups[1].Value
          if (-not $toolchain) { throw "Missing toolchain channel" }
          rustup toolchain install $toolchain --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --check
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Test workspace
        timeout-minutes: 2
        run: cargo test --workspace --locked
