name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $toolchain = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "([^"]+)"$').Matches.Groups[1].Value
          if (-not $toolchain) { throw "Missing toolchain channel" }
          rustup toolchain install $toolchain --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --check
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Test workspace
        timeout-minutes: 2
        run: cargo test --workspace --locked -- --nocapture
      - name: Stage Windows bridge probe
        if: runner.os == 'Windows' && github.event_name == 'push'
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'herdrmd-bridge-windows'
          $mod = Join-Path $bundle 'mods/herdrmd'
          New-Item -ItemType Directory -Force $mod | Out-Null
          Copy-Item target/debug/herdrmd.exe $mod
          Copy-Item integrations/herdr/mods/herdrmd/main.js,integrations/herdr/mods/herdrmd/api.js,integrations/herdr/mods/herdrmd/mod.json $mod
          Copy-Item integrations/herdr/mods/herdrmd/vault-view.js $mod
          Copy-Item docs/windows-bridge.md (Join-Path $bundle 'README.md')
          & (Join-Path $mod 'herdrmd.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows bridge probe
        if: runner.os == 'Windows' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: herdrmd-bridge-windows
          path: ${{ runner.temp }}/herdrmd-bridge-windows/
          retention-days: 7
          if-no-files-found: error
