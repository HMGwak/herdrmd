name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $toolchain = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "([^"]+)"$').Matches.Groups[1].Value
          if (-not $toolchain) { throw "Missing toolchain channel" }
          rustup toolchain install $toolchain --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --check
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Test Herdr UI contracts
        run: node --test tests/scenarios/launcher.test.mjs tests/scenarios/reader-model.test.mjs tests/scenarios/frontmatter.test.mjs tests/scenarios/wikilinks.test.mjs
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Test workspace
        timeout-minutes: 2
        run: cargo test --workspace --locked -- --nocapture
      - name: Stage Windows bridge probe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'herdrmd-bridge-windows'
          $mod = Join-Path $bundle 'mods/herdrmd'
          New-Item -ItemType Directory -Force $mod | Out-Null
          Copy-Item target/debug/herdrmd.exe $mod
          Copy-Item integrations/herdr/mods/herdrmd/*.js $mod
          Copy-Item integrations/herdr/mods/herdrmd/mod.json $mod
          Copy-Item integrations/herdr/mods/herdrmd/obsidian.svg $mod
          foreach ($name in @('herdrmd-tabs', 'herdrmd-new-menu')) {
            $destination = Join-Path $bundle "mods/$name"
            New-Item -ItemType Directory -Force $destination | Out-Null
            Copy-Item "integrations/herdr/mods/$name/main.js","integrations/herdr/mods/$name/mod.json" $destination
          }
          Copy-Item integrations/herdr/mods/herdrmd-new-menu/launcher.js (Join-Path $bundle 'mods/herdrmd-new-menu')
          Copy-Item integrations/herdr/mods/herdrmd/launcher.example.json $mod
          Copy-Item docs/open-menu.md (Join-Path $bundle 'open-menu.md')
          Copy-Item docs/windows-bridge.md (Join-Path $bundle 'README.md')
          & (Join-Path $mod 'herdrmd.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows bridge probe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: herdrmd-bridge-windows
          path: ${{ runner.temp }}/herdrmd-bridge-windows/
          retention-days: 7
          if-no-files-found: error
      - name: Build portable NAS reader
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked -p herdrmd --target x86_64-unknown-linux-musl
          target/x86_64-unknown-linux-musl/release/herdrmd --version
      - name: Upload portable NAS reader
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: herdrmd-reader-linux-x64
          path: target/x86_64-unknown-linux-musl/release/herdrmd
          retention-days: 7
          if-no-files-found: error
